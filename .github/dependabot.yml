# Dependabot will run on day 3 of each month at 02:04 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "4 2 3 * *"
    open-pull-requests-limit: 20
    assignees:
      - "weggetor"
    versioning-strategy: "increase"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '4 2 3 * *'
    open-pull-requests-limit: 15
