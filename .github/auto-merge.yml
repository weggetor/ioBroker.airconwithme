# Configure here which dependency updates should be merged automatically.
# Enhanced configuration for ioBroker adapter development

# Security updates - Always auto-merge (highest priority)
- match:
    update_type: "security:patch"
- match:
    update_type: "security:minor"

# Production dependencies - Conservative approach
- match:
    dependency_type: production
    update_type: "semver:patch"

# Development dependencies - Allow minor updates
- match:
    dependency_type: development
    update_type: "semver:patch"
- match:
    dependency_type: development
    update_type: "semver:minor"

# TypeScript ecosystem - Allow minor updates for better compatibility
- match:
    dependency_name: "typescript"
    update_type: "semver:minor"
- match:
    dependency_name: "@types/*"
    update_type: "semver:minor"

# Testing frameworks - Allow minor updates
- match:
    dependency_name: "mocha"
    update_type: "semver:minor"
- match:
    dependency_name: "chai"
    update_type: "semver:minor"
- match:
    dependency_name: "sinon"
    update_type: "semver:minor"

# Build tools and linting - Allow minor updates
- match:
    dependency_name: "eslint"
    update_type: "semver:minor"
- match:
    dependency_name: "@typescript-eslint/*"
    update_type: "semver:minor"

# GitHub Actions - Allow minor updates
- match:
    dependency_name: "actions/*"
    update_type: "semver:minor"

# NOTE: ioBroker core packages (@iobroker/adapter-core, etc.) 
# are intentionally NOT included here for manual review due to their critical nature

# The syntax is based on the legacy dependabot v1 automerged_updates syntax, see:
# https://dependabot.com/docs/config-file/#automerged_updates
